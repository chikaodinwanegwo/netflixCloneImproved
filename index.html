<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Movies</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <!-- =========================
         LOGO
    ========================== -->

    <img
        src="logo.png"
        class="logo"
        alt="Netflix"
    >


    <!-- =========================
         TRENDING NOW
    ========================== -->

    <h2>Trending now</h2>

    <div class="container">

        <button
            class="previous"
            aria-label="Previous trending movies"
        >
            <i class="fa-solid fa-chevron-left"></i>
        </button>

        <div class="slider"></div>

        <button
            class="next"
            aria-label="Next trending movies"
        >
            <i class="fa-solid fa-chevron-right"></i>
        </button>

    </div>


    <!-- =========================
         TOP RATED
    ========================== -->

    <h2>Top Rated</h2>

    <div class="container">

        <button
            class="previous2"
            aria-label="Previous top rated movies"
        >
            <i class="fa-solid fa-chevron-left"></i>
        </button>

        <div class="slider2"></div>

        <button
            class="next2"
            aria-label="Next top rated movies"
        >
            <i class="fa-solid fa-chevron-right"></i>
        </button>

    </div>


    <!-- =========================
         UPCOMING
    ========================== -->

    <h2>Upcoming</h2>

    <div class="container">

        <button
            class="previous3"
            aria-label="Previous upcoming movies"
        >
            <i class="fa-solid fa-chevron-left"></i>
        </button>

        <div class="slider3"></div>

        <button
            class="next3"
            aria-label="Next upcoming movies"
        >
            <i class="fa-solid fa-chevron-right"></i>
        </button>

    </div>


    <!-- =========================
         FONT AWESOME
    ========================== -->

    <script
        src="https://kit.fontawesome.com/cc55d42b25.js"
        crossorigin="anonymous">
    </script>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="script.js"></script>

</body>

</html>
